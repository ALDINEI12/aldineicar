<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALDINEICAR - Sistema Profissional</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
* { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
body { background:#f4f4f4; color:#333; }
header { background: #111; color: white; padding: 12px 20px; display: flex; align-items: center; justify-content: space-between; }
.logo { font-size: 26px; font-weight: bold; color: #ffd700; }
.search { width:45%; padding:12px; border-radius:10px; border:none; font-size:16px; }
.container { display:flex; min-height:calc(100vh - 56px); }
.sidebar { width: 200px; background: white; padding: 20px 15px; border-right: 1px solid #ddd; }
.sidebar button { width:100%; padding:12px; margin-bottom:8px; background:#fff; color:#333; border:1px solid #ddd; border-radius:8px; font-size:15px; cursor:pointer; }
.content { flex:1; padding:20px; }
.top-actions { display:flex; gap:10px; margin-bottom:20px; flex-wrap:wrap; }
.top-actions button { padding:14px 18px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
.btn-primary { background:#d40000; color:white; }
.btn-green { background:#00a651; color:white; }
.cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:15px; }
.card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); }
.resumo { width: 320px; background: white; padding: 20px; border-left: 1px solid #ddd; }
.modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:999; }
.modal-content { background:#1e1e1e; padding:25px; border-radius:15px; width:90%; max-width:400px; }
</style>
</head>
<body>

<!-- Login Overlay -->
<div id="loginOverlay" style="display:flex;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.96);align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#1e1e1e;padding:35px 30px;border-radius:16px;width:90%;max-width:400px;text-align:center;">
    <div style="font-size:28px;font-weight:bold;color:#ffd700;margin-bottom:4px;">ALDINEICAR</div>
    <div style="color:#888;margin-bottom:24px;">Sistema Profissional</div>

    <div style="display:flex;gap:8px;margin-bottom:22px;">
      <button onclick="toggleAuthTab('login')" style="flex:1;padding:12px;border:2px solid #ffd700;border-radius:10px;background:#ffd700;color:#111;font-weight:bold;">Entrar</button>
      <button onclick="toggleAuthTab('signup')" style="flex:1;padding:12px;border:2px solid #444;border-radius:10px;background:transparent;color:#fff;font-weight:bold;">Cadastrar</button>
    </div>

    <div id="loginTab">
      <input type="email" id="loginEmail" placeholder="Email" style="width:100%;padding:13px;margin-bottom:10px;background:#2d2d2d;color:white;border:none;border-radius:10px;">
      <input type="password" id="loginPassword" placeholder="Senha" style="width:100%;padding:13px;margin-bottom:10px;background:#2d2d2d;color:white;border:none;border-radius:10px;">
      <button onclick="handleLogin()" style="width:100%;padding:14px;background:#d40000;color:white;border:none;border-radius:10px;font-weight:bold;">Entrar</button>
    </div>

    <div id="signupTab" style="display:none;">
      <input type="text" id="signupName" placeholder="Nome completo" style="width:100%;padding:13px;margin-bottom:10px;background:#2d2d2d;color:white;border:none;border-radius:10px;">
      <input type="email" id="signupEmail" placeholder="Email" style="width:100%;padding:13px;margin-bottom:10px;background:#2d2d2d;color:white;border:none;border-radius:10px;">
      <input type="password" id="signupPassword" placeholder="Senha" style="width:100%;padding:13px;margin-bottom:10px;background:#2d2d2d;color:white;border:none;border-radius:10px;">
      <button onclick="handleSignup()" style="width:100%;padding:14px;background:#00a651;color:white;border:none;border-radius:10px;font-weight:bold;">Criar Conta</button>
    </div>
  </div>
</div>

<!-- App Principal -->
<div id="appContainer" style="display:none;flex-direction:column;min-height:100vh;">
  <header>
    <div class="logo">ALDINEICAR</div>
    <input type="text" class="search" placeholder="Buscar materiais..." onkeyup="buscar(this.value)">
    <div id="userInfo"></div>
  </header>

  <div class="container">
    <div class="sidebar">
      <h2>Menu</h2>
      <button onclick="mostrarAba('materiais')">📦 Materiais</button>
      <button onclick="mostrarAba('maoobra')">🔧 Mão de Obra</button>
      <button onclick="mostrarAba('clientes')">👤 Clientes</button>
    </div>

    <div class="content">
      <div class="top-actions">
        <button class="btn-primary" onclick="abrirModal()">➕ Novo Material</button>
        <button class="btn-green" onclick="salvarOrcamento()">💾 Salvar Orçamento</button>
        <button class="btn-primary" onclick="gerarPDF()">📄 Gerar PDF</button>
      </div>

      <div id="aba-materiais" style="display:none;">
        <div class="cards" id="lista">Carregando materiais...</div>
      </div>

      <div id="aba-maoobra" style="display:none;">
        <h2>Mão de Obra</h2>
        <!-- Adicione o conteúdo aqui depois -->
      </div>

      <div id="aba-clientes" style="display:none;">
        <h2>Clientes</h2>
      </div>
    </div>

    <div class="resumo">
      <h2>Resumo</h2>
      <div>Total: R$ <span id="total">0.00</span></div>
      <input type="text" id="clienteNome" placeholder="Nome do cliente">
      <button class="btn-green" onclick="enviarWhatsApp()">📱 WhatsApp</button>
      <button class="btn-primary" onclick="limparResumo()">🗑️ Limpar</button>
    </div>
  </div>
</div>

<!-- Modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 style="color:white;">Novo Material</h2>
    <input type="text" id="nomeMaterial" placeholder="Nome">
    <input type="number" id="valorMaterial" placeholder="Valor">
    <button onclick="salvarMaterial()">Salvar</button>
    <button onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
// ==================== CONFIGURAÇÃO SUPABASE ====================
const supabaseUrl = 'https://SUA-URL.supabase.co';     // ← TROQUE AQUI
const supabaseAnonKey = 'SUA_ANON_KEY_AQUI';           // ← TROQUE AQUI

const supabase = Supabase.createClient(supabaseUrl, supabaseAnonKey);

// ==================== FUNÇÕES ====================
function mostrarAba(aba) {
  document.querySelectorAll('[id^="aba-"]').forEach(el => el.style.display = 'none');
  document.getElementById(`aba-${aba}`).style.display = 'block';
}

function buscar(termo) {
  termo = termo.toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    card.style.display = card.textContent.toLowerCase().includes(termo) ? '' : 'none';
  });
}

function gerarPDF() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  doc.text("Orçamento - ALDINEICAR", 20, 20);
  doc.save("orcamento.pdf");
}

function enviarWhatsApp() {
  const nome = document.getElementById('clienteNome').value || "Cliente";
  const total = document.getElementById('total').innerText;
  const msg = `Olá ${nome}, seu orçamento é R$ ${total}`;
  window.open(`https://wa.me/55SEUNUMERO?text=${encodeURIComponent(msg)}`);
}

function limparResumo() {
  document.getElementById('total').innerText = '0.00';
  document.getElementById('clienteNome').value = '';
}

function abrirModal() { document.getElementById('modal').style.display = 'flex'; }
function fecharModal() { document.getElementById('modal').style.display = 'none'; }

function salvarMaterial() {
  alert("Material salvo! (ainda sem integração completa com Supabase)");
  fecharModal();
}

function salvarOrcamento() {
  alert("Orçamento salvo!");
}

function handleLogin() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  mostrarAba('materiais');
}

function handleSignup() {
  alert("Conta criada!");
  handleLogin();
}

function toggleAuthTab(tab) {
  document.getElementById('loginTab').style.display = tab === 'login' ? 'block' : 'none';
  document.getElementById('signupTab').style.display = tab === 'signup' ? 'block' : 'none';
}

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
  console.log('✅ Aldineicar carregado com sucesso!');
});
</script>

</body>
</html>
