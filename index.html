<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALDINEICAR - Sistema Profissional</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:Arial, sans-serif; }
        
        header { background: #111; color: white; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; height: 70px; }
        .logo-container { height: 100%; display: flex; align-items: center; }
        .logo-img { height: 55px; width: auto; object-fit: contain; }
        .search { width:45%; padding:12px; border-radius:10px; border:none; font-size:16px; }
        
        .container { display:flex; min-height:100vh; }
        .sidebar { width: 200px; background: white; padding: 20px 15px; border-right: 1px solid #ddd; display: flex; flex-direction: column; justify-content: space-between; }
        .sidebar h2 { margin-bottom:15px; color:#ffd700; }
        .sidebar button { width:100%; padding:12px; margin-bottom:8px; background:#fff; color:#333; border:1px solid #ddd; border-radius:8px; font-size:15px; cursor:pointer; text-align: left; }
        .sidebar button:hover { background:#ffe6e6; color:#d40000; }
        .sidebar .btn-logout { background: #f44336; color: white; border: none; text-align: center; font-weight: bold; margin-top: auto; }
        .sidebar .btn-logout:hover { background: #b71c1c; color: white; }
        
        .content { flex:1; padding:20px; display: flex; flex-direction: column; gap: 20px; }
        .top-actions { display:flex; gap:10px; flex-wrap:wrap; }
        .top-actions button { padding:14px 18px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
        
        .btn-primary { background:#d40000; color:white; }
        .btn-green { background:#00a651; color:white; }
        
        .main-layout { display: flex; gap: 20px; flex: 1; }
        .aba-container { flex: 1; }
        
        .cards { display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:15px; }
        .card { background: white; border-radius: 10px; padding: 15px; box-shadow: 0 3px 10px rgba(0,0,0,0.1); transition: 0.2s; }
        .card:hover { transform:translateY(-3px); }
        .card h3 { font-size:18px; margin-bottom:6px; }
        
        .preco { color: #d40000; font-size: 22px; font-weight: bold; margin: 10px 0; }
        .controls { display:flex; align-items:center; gap:10px; margin-top:10px; }
        .controls button { width:38px; height:38px; border:none; border-radius:50%; font-size:22px; font-weight:bold; cursor:pointer; }
        .btn-plus { background:#00a651; color:white; }
        .btn-minus { background:#444; color:white; }
        .qtd { font-size:20px; font-weight:bold; }
        
        .resumo { width: 320px; background: white; padding: 20px; border: 1px solid #ddd; border-radius: 10px; height: fit-content; }
        .resumo h2 { margin-bottom:15px; color:#ffd700; }
        .resumo div { margin-bottom:10px; font-size: 15px; }
        .resumo input { width:100%; padding:10px; margin-top:5px; border:1px solid #ddd; border-radius:8px; font-size: 14px; }
        .resumo button { width:100%; padding:14px; margin-top:10px; border:none; border-radius:10px; font-weight:bold; cursor:pointer; }
        
        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.8); align-items:center; justify-content:center; z-index:999; }
        .modal-content { background:#1e1e1e; padding:25px; border-radius:15px; width:90%; max-width:400px; color: white; max-height: 90vh; overflow-y: auto; }
        .modal-content input, .modal-content select { width:100%; padding:12px; margin:10px 0; border:none; border-radius:10px; color: #000; }
        .modal-content button { width:100%; padding:14px; border:none; border-radius:10px; margin-top:10px; font-weight:bold; cursor:pointer; }
        
        .clientes { margin-top:30px; }
        .cliente-item { background:white; padding:15px; border-radius:14px; margin-bottom:12px; border:1px solid #e5e5e5; box-shadow:0 2px 8px rgba(0,0,0,0.08); color: #333; }
        
        .add-servico-btn { width:100%; padding:16px; border:none; border-radius:14px; font-size:16px; font-weight:bold; display:flex; align-items:center; justify-content:center; gap:10px; cursor:pointer; transition:0.2s; box-shadow:0 4px 10px rgba(0,166,81,0.25); }
        .add-servico-btn span { font-size:24px; line-height:1; }
        .add-servico-btn:hover { transform:translateY(-2px); opacity:0.95; }
        
        .categorias-materiais { display:flex; gap:12px; margin-bottom:22px; flex-wrap:wrap; }
        .categorias-materiais button { padding:12px 18px; border:none; border-radius:30px; background:white; color:#444; font-weight:bold; font-size:14px; cursor:pointer; transition:0.2s; box-shadow:0 2px 8px rgba(0,0,0,0.08); border:1px solid #e5e5e5; }
        .categorias-materiais button:hover, .categorias-materiais button.active { transform:translateY(-2px); background:#d40000; color:white; box-shadow:0 4px 12px rgba(212,0,0,0.25); }
        
        @media(max-width:900px){
            .container { flex-direction:column; }
            .sidebar { width:100%; display:flex; flex-direction: row; gap:10px; overflow:auto; padding: 10px; height: auto; }
            .sidebar button { min-width:160px; margin-bottom: 0; }
            .sidebar .btn-logout { margin-top: 0; }
            .search { width:55%; }
            .main-layout { flex-direction: column; }
            .resumo { width:100%; margin-top:20px; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay" style="display:flex; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; z-index:9999;">
        <div style="background:#1e1e1e; padding:35px; border-radius:16px; width:90%; max-width:400px; text-align:center;">
            <h1 style="color:#ffd700; margin-bottom:8px;">ALDINEICAR</h1>
            <p style="color:#888; margin-bottom:25px;">Sistema Profissional</p>

            <div style="display:flex; gap:8px; margin-bottom:20px;">
                <button id="tabLogin" onclick="toggleTab('login')" style="flex:1; padding:12px; background:#ffd700; color:#111; border:none; border-radius:10px; font-weight:bold;">Entrar</button>
                <button id="tabSignup" onclick="toggleTab('signup')" style="flex:1; padding:12px; background:transparent; color:white; border:2px solid #444; border-radius:10px; font-weight:bold;">Cadastrar</button>
            </div>

            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <input type="password" id="loginPassword" placeholder="Senha" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <button onclick="handleLogin()" style="width:100%; padding:14px; background:#d40000; color:white; border:none; border-radius:10px; margin-top:10px; font-weight:bold;">Entrar</button>
            </div>

            <div id="signupForm" style="display:none;">
                <input type="text" id="signupName" placeholder="Nome completo" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <input type="email" id="signupEmail" placeholder="Email" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <input type="password" id="signupPassword" placeholder="Senha (mín. 6 caracteres)" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <button onclick="handleSignup()" style="width:100%; padding:14px; background:#00a651; color:white; border:none; border-radius:10px; margin-top:10px; font-weight:bold;">Criar Conta</button>
            </div>
        </div>
    </div>

    <div id="appContainer">
        <header>
            <div class="logo-container" id="headerLogoContainer">
                <span id="headerTextoFallback" style="font-weight: bold; font-size: 20px; display: none;">ALDINEICAR</span>
            </div>
            <input type="text" class="search" placeholder="Buscar materiais..." onkeyup="buscar(this.value)">
        </header>

        <div class="container">
            <div class="sidebar">
                <div>
                    <h2>Menu</h2>
                    <button onclick="mostrarAba('maoobra')">🔧 Mão de Obra</button>
                    <button onclick="mostrarAba('materiais')">📦 Materiais</button>
                    <button onclick="mostrarAba('clientes')">👤 Clientes</button>
                    <button onclick="mostrarAba('historico')">📋 Histórico</button>
                    <button onclick="abrirModalOficina()" style="background:#f9f9f9; border: 1px dashed #bbb;">⚙️ Configurar Oficina</button>
                </div>
                <button onclick="handleLogout()" class="btn-logout">🚪 Sair</button>
            </div>

            <div class="content">
                <div class="top-actions">
                    <button class="btn-primary" onclick="abrirModal()">➕ Novo Material</button>
                    <button class="btn-green" onclick="salvarOrcamento()">💾 Salvar Orçamento</button>
                    <button class="btn-primary" onclick="gerarPDFdoResumo()">📄 Gerar PDF</button>
                </div>

                <div class="main-layout">
                    <div class="aba-container">
                        <div id="aba-materiais">
                            <div class="categorias-materiais">
                                <button onclick="filtrarCategoria('Todos')" class="btn-green">Todos</button>
                                <button onclick="filtrarCategoria('Primer')">Primer</button>
                                <button onclick="filtrarCategoria('Tintas')">Tintas</button>
                                <button onclick="filtrarCategoria('Verniz')">Verniz</button>
                                <button onclick="filtrarCategoria('Massa')">Massa</button>
                                <button onclick="filtrarCategoria('Thinner')">Thinner</button>
                                <button onclick="filtrarCategoria('Acessórios')" class="btn-primary">Acessórios</button>
                            </div>
                            <div class="cards" id="lista"></div>
                        </div>

                        <div id="aba-maoobra" style="display:none">
                            <h2>Mão de Obra</h2>
                            <div class="card" style="margin-bottom:20px; margin-top: 15px;">
                                <input type="text" id="nomeServico" placeholder="Nome da peça ou serviço" style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;">
                                <input type="number" id="valorServico" placeholder="Valor da mão de obra" style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;">
                                <button class="btn-green add-servico-btn" onclick="adicionarMaoObra()">
                                    <span>＋</span> Adicionar Serviço
                                </button>
                            </div>
                            <div id="listaMaoObra"></div>
                        </div>

                        <div id="aba-clientes" style="display:none">
                            <h2>Clientes Cadastrados</h2>
                            <div class="clientes" id="listaClientes"></div>
                        </div>

                        <div id="aba-historico" style="display:none">
                            <h2>Histórico de Orçamentos</h2>
                            <div id="historicoLista" style="margin-top: 15px;"></div>
                        </div>
                    </div>

                    <div class="resumo">
                        <h2>Resumo</h2>
                        <div>Custo Materiais: R$ <span id="totalMateriais">0.00</span></div>
                        <div>Mão de Obra Total: R$ <span id="totalMaoObra">0.00</span></div>
                        <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #ddd;">
                        
                        <label style="font-size:12px; font-weight:bold; color:#555;">CLIENTE</label>
                        <input type="text" id="clienteNome" placeholder="Nome do cliente">
                        <input type="text" id="clienteEndereco" placeholder="Endereço">
                        <input type="text" id="clienteTel" placeholder="Telefone">
                        <input type="text" id="clienteCidade" placeholder="Cidade/UF" value="Sátrio Dias/BA">
                        
                        <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #ddd;">
                        <label style="font-size:12px; font-weight:bold; color:#555;">VEÍCULO</label>
                        <input type="text" id="veiculoModelo" placeholder="Modelo (Ex: Palio)">
                        <input type="text" id="veiculoPlaca" placeholder="Placa">
                        <input type="text" id="veiculoAno" placeholder="Ano">
                        <input type="text" id="veiculoCor" placeholder="Cor">
                        <input type="text" id="nomeAvaliador" placeholder="Nome do Avaliador">
                        <input type="text" id="tipoServico" placeholder="Tipo de Serviço (Ex: Pintura Geral)">

                        <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #ddd;">
                        <label style="font-size:12px; font-weight:bold; color:#555;">FINANCEIRO</label>
                        <input type="number" id="valorCliente" placeholder="Valor total cobrado" oninput="atualizarResumo()">
                        
                        <div style="margin-top: 15px; font-weight: bold; font-size: 16px;">
                            Lucro Real: <span style="color: #00a651;">R$ <span id="lucro">0.00</span></span>
                        </div>
                        <button class="btn-green" onclick="enviarWhatsApp()">📱 Enviar WhatsApp</button>
                        <button class="btn-primary" onclick="limparResumo()">🗑️ Limpar Resumo</button>
                    </div>
                </div>
            </div> 
        </div> 
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Novo Material</h2>
            <input type="text" id="nomeMaterial" placeholder="Nome">
            <input type="number" id="valorMaterial" placeholder="Valor">
            <select id="categoriaMaterial" aria-label="Selecione a categoria do material">
                <option value="Primer">Primer</option>
                <option value="Tintas">Tintas</option>
                <option value="Verniz">Verniz</option>
                <option value="Massa">Massa</option>
                <option value="Thinner">Thinner</option>
                <option value="Acessórios">Acessórios</option>
            </select>
            <button class="btn-green" onclick="salvarMaterial()">Salvar</button>
            <button class="btn-primary" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modalOficina">
        <div class="modal-content">
            <h2>Dados da Minha Oficina</h2>
            
            <label style="font-size:11px; font-weight:bold; color:#ffd700; display:block; margin-top:10px;">LOGO DA OFICINA</label>
            <input type="file" id="oficinaLogoFile" accept="image/*" onchange="processarNovaLogo(this)" style="background: #2d2d2d; color: white; border: none; padding: 5px;">
            <div id="previewLogoModal" style="margin-top: 5px; text-align: center;"></div>
            
            <label style="font-size:11px; font-weight:bold; color:#ffd700; display:block; margin-top:10px;">NOME COMERCIAL</label>
            <input type="text" id="oficinaNome" placeholder="Nome Comercial" value="ALDINEICAR">
            
            <input type="text" id="oficinaCnpj" placeholder="CNPJ / CPF">
            <input type="text" id="oficinaEnd" placeholder="Endereço Completo">
            <input type="text" id="oficinaCep" placeholder="CEP e Cidade/UF">
            <input type="text" id="oficinaFone" placeholder="Telefone(s)">
            <input type="text" id="oficinaEmail" placeholder="E-mail">
            <input type="text" id="oficinaPix" placeholder="Chave PIX para pagamento">
            <button class="btn-green" onclick="salvarDadosOficina()">Salvar Dados</button>
            <button class="btn-primary" onclick="fecharModalOficina()">Fechar</button>
        </div>
    </div>

    <div id="modalConfirmar" class="modal">
        <div class="modal-content" style="max-width:350px; text-align:center; background:white; color:#333;">
            <h2 style="margin-bottom:15px;">Confirmar exclusão</h2>
            <p id="textoConfirmacao" style="margin-bottom:20px; font-size:15px; color:#666;">Deseja realmente excluir?</p>
            <div style="display:flex; gap:10px;">
                <button onclick="fecharConfirmacao()" style="flex:1; padding:14px; border:none; border-radius:12px; background:#ddd; font-weight:bold; cursor:pointer;">Cancelar</button>
                <button id="btnConfirmarAcao" style="flex:1; padding:14px; border:none; border-radius:12px; background:#d40000; color:white; font-weight:bold; cursor:pointer;">Excluir</button>
            </div>
        </div>
    </div>

    <script>
    const supabaseUrl = 'https://nhqipyzikujszddoxlir.supabase.co';
    const supabaseKey = 'sb_publishable_PRTUmHIzf0pbq09qn9RwvQ_DZQowl4D';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let usuarioAtualId = null;
    let materiais = [];
    let historico = [];
    let clientes = []; 
    let maoObraItens = [];
    let dadosOficina = { nome: 'ALDINEICAR', cnpj: '', end: '', cep: '', fone: '', email: '', pix: '', logoBase64: '' };
    let categoriaAtual = 'Todos';
    let acaoConfirmada = null;

    const materiaisPadrao = [
        {nome:'Primer PU',valor:25,qtd:0,cat:'Primer'},
        {nome:'Verniz PU',valor:65,qtd:0,cat:'Verniz'},
        {nome:'Massa Poliéster',valor:30,qtd:0,cat:'Massa'},
        {nome:'Preto Ninja',valor:55,qtd:0,cat:'Tintas'}
    ];

    async function carregarDadosDoUsuario(userId) {
        if (!userId) return;
        usuarioAtualId = userId;
        
        const fallback = localStorage.getItem(`aldineicar_fallback_${userId}`);
        if(fallback){
            const parsed = JSON.parse(fallback);
            materiais = parsed.materiais || [...materiaisPadrao];
            historico = parsed.historico || [];
            clientes = parsed.clientes || [];
            maoObraItens = parsed.maoObraItens || [];
            dadosOficina = parsed.dadosOficina || dadosOficina;
        } else {
            materiais = [...materiaisPadrao];
        }

        try {
            const { data, error } = await supabaseClient
                .from('user_data')
                .select('*')
                .eq('user_id', userId);

            if (error) {
                await salvarNoBanco(true); 
            } else if (data && data.length > 0) {
                const registro = data[0];
                materiais = registro.materiais || [...materiaisPadrao];
                historico = registro.historico || [];
                clientes = registro.clientes || [];
                maoObraItens = registro.mao_obra || [];
                if(registro.dados_oficina) dadosOficina = registro.dados_oficina;
                
                clientes = clientes.map(c => typeof c === 'string' ? {nome: c, endereco: '', tel: '', cidade: ''} : c);
                salvarFallbackLocal();
            } else {
                await salvarNoBanco(true);
            }
        } catch (err) {
            console.error("Erro na comunicação com a nuvem:", err);
        }

        atualizarInputsOficina();
        atualizarLogoHeader();
        render();
        renderMaoObra();
        renderHistorico();
        renderClientes();
    }
    
    function salvarFallbackLocal() {
        if (!usuarioAtualId) return;
        localStorage.setItem(`aldineicar_fallback_${usuarioAtualId}`, JSON.stringify({
            materiais, historico, clientes, maoObraItens, dadosOficina
        }));
    }

    async function salvarNoBanco(silencioso = false) {
        if (!usuarioAtualId) return;
        salvarFallbackLocal();
        try {
            const { error } = await supabaseClient
                .from('user_data')
                .upsert({
                    user_id: usuarioAtualId,
                    materiais: materiais,
                    historico: historico,
                    clientes: clientes,
                    mao_obra: maoObraItens,
                    dados_oficina: dadosOficina,
                    updated_at: new Date()
                }, { onConflict: 'user_id' });
        } catch(e) {
            console.error("Falha de rede ao tentar sincronizar:", e);
        }
    }

    function abrirModalOficina() { 
        atualizarInputsOficina();
        document.getElementById('modalOficina').style.display='flex'; 
    }
    
    function fecharModalOficina() { document.getElementById('modalOficina').style.display='none'; }
    
    function processarNovaLogo(input) {
        const file = input.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            dadosOficina.logoBase64 = e.target.result;
            const preview = document.getElementById('previewLogoModal');
            if(preview) preview.innerHTML = `<img src="${dadosOficina.logoBase64}" style="max-height:50px; margin-top:5px; border-radius:5px;">`;
        };
        reader.readAsDataURL(file);
    }

    function atualizarLogoHeader() {
        const container = document.getElementById('headerLogoContainer');
        if (!container) return;
        if (dadosOficina.logoBase64) {
            container.innerHTML = `<img src="${dadosOficina.logoBase64}" alt="Logo Oficina" class="logo-img">`;
        } else {
            container.innerHTML = `<span id="headerTextoFallback" style="font-weight: bold; font-size: 20px; color: white;">${dadosOficina.nome ? dadosOficina.nome.toUpperCase() : 'ALDINEICAR'}</span>`;
        }
    }

    function atualizarInputsOficina() {
        document.getElementById('oficinaNome').value = dadosOficina.nome || 'ALDINEICAR';
        document.getElementById('oficinaCnpj').value = dadosOficina.cnpj || '';
        document.getElementById('oficinaEnd').value = dadosOficina.end || '';
        document.getElementById('oficinaCep').value = dadosOficina.cep || '';
        document.getElementById('oficinaFone').value = dadosOficina.fone || '';
        document.getElementById('oficinaEmail').value = dadosOficina.email || '';
        document.getElementById('oficinaPix').value = dadosOficina.pix || '';
        
        const preview = document.getElementById('previewLogoModal');
        if (dadosOficina.logoBase64 && preview) {
            preview.innerHTML = `<img src="${dadosOficina.logoBase64}" style="max-height:50px; margin-top:5px; border-radius:5px;">`;
        } else if (preview) {
            preview.innerHTML = '';
        }
    }

    async function salvarDadosOficina() {
        dadosOficina.nome = document.getElementById('oficinaNome').value;
        dadosOficina.cnpj = document.getElementById('oficinaCnpj').value;
        dadosOficina.end = document.getElementById('oficinaEnd').value;
        dadosOficina.cep = document.getElementById('oficinaCep').value;
        dadosOficina.fone = document.getElementById('oficinaFone').value;
        dadosOficina.email = document.getElementById('oficinaEmail').value;
        dadosOficina.pix = document.getElementById('oficinaPix').value;
        atualizarLogoHeader();
        fecharModalOficina();
        alert("Informações da oficina salvas!");
        await salvarNoBanco();
    }

    function toggleTab(tab) {
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btnEntrar = document.querySelector('#loginForm button');

        if (!email || !password) {
            alert("Por favor, preencha o e-mail e a senha.");
            return;
        }

        const textoOriginal = btnEntrar.innerText;
        btnEntrar.innerText = "Entrando...";
        btnEntrar.disabled = true;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Erro ao entrar: " + error.message);
                btnEntrar.innerText = textoOriginal;
                btnEntrar.disabled = false;
                return;
            }

            if (data && data.user) {
                await carregarDadosDoUsuario(data.user.id);
                document.getElementById('loginOverlay').style.display = 'none';
                mostrarAba('materiais');
            }
        } catch (err) {
            alert("Erro de conexão ou no servidor: " + err.message);
        } finally {
            btnEntrar.innerText = textoOriginal;
            btnEntrar.disabled = false;
        }
    }

    async function handleSignup() {
        const nome = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const btnCadastrar = document.querySelector('#signupForm button');

        if (!email || !password || password.length < 6) {
            alert("Preencha todos os campos corretamente (Senha mínima de 6 caracteres)");
            return;
        }

        const textoOriginal = btnCadastrar.innerText;
        btnCadastrar.innerText = "Cadastrando...";
        btnCadastrar.disabled = true;

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email, password, options: { data: { nome } }
            });

            if (error) {
                alert("Erro ao cadastrar: " + error.message);
                return;
            }

            alert("Cadastro realizado com sucesso! Agora faça login.");
            toggleTab('login');
        } catch (err) {
            alert("Erro no processo de cadastro: " + err.message);
        } finally {
            btnCadastrar.innerText = textoOriginal;
            btnCadastrar.disabled = false;
        }
    }

        await supabaseClient.auth.signOut();

    async function mais(i){ materiais[i].qtd++; render(); await salvarNoBanco(); }
    async function menos(i){ if(materiais[i].qtd>0){ materiais[i].qtd--; render(); await salvarNoBanco(); } }

    function atualizarResumo(){
        let totalMateriais = materiais.reduce((s,item)=>s+(item.valor*item.qtd),0);
        let totalMaoObra = maoObraItens.reduce((s,item)=>s+item.valor,0);
        let valorCobrado = parseFloat(document.getElementById('valorCliente').value) || 0;
        let lucroReal = valorCobrado - totalMateriais;

        const tm = document.getElementById('totalMateriais');
        const tmo = document.getElementById('totalMaoObra');
        const l = document.getElementById('lucro');

        if(tm) tm.innerText = totalMateriais.toFixed(2);
        if(tmo) tmo.innerText = totalMaoObra.toFixed(2);
        if(l) l.innerText = lucroReal.toFixed(2);
    }

    async function salvarMaterial(){
        const nome = document.getElementById('nomeMaterial').value;
        const valor = parseFloat(document.getElementById('valorMaterial').value);
        const cat = document.getElementById('categoriaMaterial').value;
        if(!nome || isNaN(valor)) return;
        materiais.push({nome,valor,qtd:0,cat});
        render(); fecharModal();
        document.getElementById('nomeMaterial').value = '';
        document.getElementById('valorMaterial').value = '';
        await salvarNoBanco();
    }

    async function deletarMaterial(index){
        abrirConfirmacao('Deseja remover este material?', async function(){

    async function editarMaterial(index){
        const material = materiais[index];
        const novoNome = prompt('Editar nome:', material.nome);
        if(!novoNome) return;
        const novoValor = parseFloat(prompt('Editar valor:', material.valor));
        if(isNaN(novoValor)) return;
        material.nome = novoNome; material.valor = novoValor;
        render(); await salvarNoBanco();
    }

    async function salvarOrcamento(){
        const clienteNome = document.getElementById('clienteNome').value || 'Sem nome';
        const clienteEndereco = document.getElementById('clienteEndereco').value || '';
        const clienteTel = document.getElementById('clienteTel').value || '';
        const clienteCidade = document.getElementById('clienteCidade').value || 'Sátrio Dias/BA';

        const veiculoModelo = document.getElementById('veiculoModelo').value || 'Não informado';
        const veiculoPlaca = document.getElementById('veiculoPlaca').value || '---';
        const veiculoAno = document.getElementById('veiculoAno').value || '';
        const veiculoCor = document.getElementById('veiculoCor').value || '';
        const nomeAvaliador = document.getElementById('nomeAvaliador').value || '';
        const valorCobrado = document.getElementById('valorCliente').value || '0.00';

        const snapshotMateriais = materiais.map(m => ({ ...m }));
        const snapshotMaoObra = maoObraItens.map(m => ({ ...m }));

        const dadosOrcamento = {
            id: 'orc_' + Date.now(),
            cliente: { nome: clienteNome, endereco: clienteEndereco, tel: clienteTel, cidade: clienteCidade },
            veiculo: { modelo: veiculoModelo, placa: veiculoPlaca, ano: veiculoAno, cor: veiculoCor, avaliador: nomeAvaliador },
            totalCobrado: parseFloat(valorCobrado).toFixed(2),
            totalMateriaisCalculado: document.getElementById('totalMateriais').innerText,
            totalMaoObraCalculado: document.getElementById('totalMaoObra').innerText,
            lucro: document.getElementById('lucro').innerText,
            listaMateriais: snapshotMateriais,
            listaMaoObra: snapshotMaoObra,
            data: new Date().toLocaleString()
        };

        historico.unshift(dadosOrcamento);
        const clienteExiste = clientes.find(c => c.nome.toLowerCase() === clienteNome.toLowerCase());
        if (!clienteExiste && clienteNome !== 'Sem nome') {
            clientes.unshift({ nome: clienteNome, endereco: clienteEndereco, tel: clienteTel, cidade: clienteCidade });
        }
        renderHistorico(); renderClientes();
        alert('Orçamento salvo com sucesso!');
        await salvarNoBanco();
    }

    function carregarParaEditar(index) {
        const item = historico[index];
        if(!item) return;

        document.getElementById('clienteNome').value = item.cliente.nome;
        document.getElementById('clienteEndereco').value = item.cliente.endereco || '';
        document.getElementById('clienteTel').value = item.cliente.tel || '';
        document.getElementById('clienteCidade').value = item.cliente.cidade || '';
        document.getElementById('veiculoModelo').value = item.veiculo.modelo;
        document.getElementById('veiculoPlaca').value = item.veiculo.placa;
        document.getElementById('veiculoAno').value = item.veiculo.ano || '';
        document.getElementById('veiculoCor').value = item.veiculo.cor || '';
        document.getElementById('nomeAvaliador').value = item.veiculo.avaliador || '';
        document.getElementById('valorCliente').value = item.totalCobrado;

        if (item.listaMateriais && item.listaMateriais.length > 0) {
            materiais.forEach(m => {
                const salvo = item.listaMateriais.find(s => s.nome === m.nome);
                m.qtd = salvo ? salvo.qtd : 0;
            });
        }
        maoObraItens = item.listaMaoObra ? item.listaMaoObra.map(m => ({ ...m })) : [];

        render(); renderMaoObra(); atualizarResumo();
        mostrarAba('materiais');
        alert(`Orçamento de ${item.cliente.nome} carregado para edição!`);
    }

    function construirDocumentoPDF(nomeCli, endCli, telCli, cidCli, modVeic, placVeic, anoVeic, corVeic, avaliador, tipoServico, valorFinal, dataOrc) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        let y = 15;

        if (dadosOficina.logoBase64) {
            try { doc.addImage(dadosOficina.logoBase64, 'PNG', 15, y, 45, 20); } catch (e) {
                doc.setFillColor(240,240,240); doc.rect(15, y, 45, 20, 'F');
            }
        } else {
            doc.setFillColor(240,240,240); doc.rect(15, y, 45, 20, 'F');
        }

        doc.setFont('Helvetica', 'bold').setFontSize(16).setTextColor(0,0,0);
        doc.text((dadosOficina.nome || 'ALDINEICAR').toUpperCase(), 65, y + 5);
        
        doc.setFont('Helvetica', 'normal').setFontSize(9).setTextColor(60,60,60);
        doc.text(`CNPJ/CPF: ${dadosOficina.cnpj || '---'}`, 65, y + 10);
        doc.text(`END: ${dadosOficina.end || '---'}`, 65, y + 14);
        doc.text(`CEP: ${dadosOficina.cep || '---'}`, 65, y + 18);
        doc.text(`FONE: ${dadosOficina.fone || '---'}`, 65, y + 22);
        doc.text(`EMAIL: ${dadosOficina.email || '---'}`, 65, y + 26);
        doc.text(`PIX: ${dadosOficina.pix || '---'}`, 65, y + 30);

        doc.setFont('Helvetica', 'bold').setFontSize(10).setTextColor(0,0,0);
        doc.text(dataOrc, 175, y + 5);
        y += 36;
        doc.setDrawColor(200, 200, 200).line(15, y, 195, y);
        y += 5;

        doc.setDrawColor(0,0,0).rect(85, y, 40, 8);
        doc.setFont('Helvetica', 'bold').setFontSize(11).text('ORÇAMENTO', 92, y + 5.5);
        y += 15;

        doc.setFontSize(9).setTextColor(100,100,100).text('PLACA', 25, y).text('MODELO', 95, y).text('AVALIADOR', 155, y);
        y += 4;
        doc.setFont('Helvetica', 'bold').setTextColor(0,0,0).setFontSize(10);
        doc.text(placVeic || '---', 25, y).text(modVeic || '---', 95, y).text(avaliador || '---', 155, y);
        
        y += 4; doc.setDrawColor(0, 0, 0).setLineWidth(0.4).line(15, y, 195, y); y += 6;

        doc.setFont('Helvetica', 'bold').setFontSize(11).text('VEÍCULO', 15, y).text('CLIENTE', 110, y);
        y += 2; doc.setLineWidth(0.2).line(15, y, 100, y).line(110, y, 195, y); y += 5;

        doc.setFont('Helvetica', 'normal').setFontSize(9.5);
        doc.text(`MODELO: ${modVeic || '---'}`, 15, y).text(`NOME: ${nomeCli || '---'}`, 110, y); y += 5.5;
        doc.text(`PLACA: ${placVeic || '---'}`, 15, y).text(`ENDEREÇO: ${endCli || '---'}`, 110, y); y += 5.5;
        doc.text(`ANO: ${anoVeic || '---'}`, 15, y).text(`TEL: ${telCli || '---'}`, 110, y); y += 5.5;
        doc.text(`COR: ${corVeic || '---'}`, 15, y).text(`CIDADE: ${cidCli || '---'}`, 110, y);
        
        // --- SEÇÃO DO TIPO DE SERVIÇO ADICIONADA AQUI ---
        y += 8;
        doc.setFont('Helvetica', 'bold').setFontSize(10).text('SERVIÇO A SER REALIZADO:', 15, y);
        y += 4.5;
        doc.setFont('Helvetica', 'normal').setFontSize(9.5).text(tipoServico.toUpperCase(), 15, y);
        // ------------------------------------------------

        y += 7; doc.setLineWidth(0.8).line(15, y, 195, y); y += 10;
        doc.setLineWidth(0.3).rect(65, y, 80, 16);
        doc.setFont('Helvetica', 'normal').setFontSize(9).text('TOTAL R$', 98, y + 5);
        doc.setFont('Helvetica', 'bold').setFontSize(15).text(`R$ ${parseFloat(valorFinal).toFixed(2)}`, 91, y + 12);
        
        y += 26; doc.setLineWidth(0.2).rect(15, y, 180, 16);
        doc.setFont('Helvetica', 'bold').setFontSize(9).text('OBSERVAÇÕES', 18, y + 5);
        doc.setFont('Helvetica', 'normal').setFontSize(9).text('ORÇAMENTO VÁLIDO POR 30 DIAS', 18, y + 11);
        
        y += 35; doc.setLineWidth(0.2).line(60, y, 150, y); y += 4;
        doc.setFont('Helvetica', 'bold').setFontSize(9).text('ASSINATURA DO CLIENTE', 85, y);

        doc.save(`orcamento_${nomeCli.replace(/\s+/g, '_')}.pdf`);
    }

    function abrirConfirmacao(texto, callback){
        document.getElementById('modalConfirmar').style.display='flex';
        document.getElementById('textoConfirmacao').innerText = texto;
        acaoConfirmada = callback;
    }
    function fecharConfirmacao(){ document.getElementById('modalConfirmar').style.display='none'; }
    document.getElementById('btnConfirmarAcao').addEventListener('click', function(){ if(acaoConfirmada) acaoConfirmada(); fecharConfirmacao(); });

    async function deletarHistorico(index){ abrirConfirmacao('Deseja excluir este orçamento do histórico?', async function(){ historico.splice(index,1); renderHistorico(); await salvarNoBanco(); }); }
    async function deletarCliente(index){ abrirConfirmacao('Deseja excluir este registro de cliente?', async function(){ clientes.splice(index,1); renderClientes(); await salvarNoBanco(); }); }
    async function limparResumo(){
        abrirConfirmacao('Deseja limpar todo o resumo?', async function(){
            materiais.forEach(item=>{ item.qtd = 0; }); maoObraItens = [];
            document.getElementById('clienteNome').value = ''; document.getElementById('clienteEndereco').value = '';
            document.getElementById('clienteTel').value = ''; document.getElementById('veiculoModelo').value = '';
            document.getElementById('veiculoPlaca').value = ''; document.getElementById('veiculoAno').value = '';
            document.getElementById('veiculoCor').value = ''; document.getElementById('nomeAvaliador').value = '';
            document.getElementById('valorCliente').value = '';
            render(); renderMaoObra(); atualizarResumo(); await salvarNoBanco();
        });
    }

    function filtrarCategoria(cat){ categoriaAtual = cat; render(); }

    document.addEventListener('DOMContentLoaded', () => {
        toggleTab('login');
        supabaseClient.auth.onAuthStateChange(async (event, session) => {
            if (session && session.user) {
                await carregarDadosDoUsuario(session.user.id);
                document.getElementById('loginOverlay').style.display = 'none';
                const abas = ['aba-materiais', 'aba-clientes', 'aba-historico', 'aba-maoobra'];
                const algumaAtiva = abas.some(id => document.getElementById(id).style.display === 'block');
                if (!algumaAtiva) mostrarAba('materiais');
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                toggleTab('login');
            }
        });
    });
