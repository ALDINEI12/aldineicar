<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALDINEICAR - Sistema Profissional</title>
    <link rel="manifest" href="manifest.json">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        
        body { background-color: #f8fafc; color: #0f172a; -webkit-font-smoothing: antialiased; }
        
        header { background: #09090b; color: white; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; height: 72px; border-bottom: 1px solid #1e1e24; }
        .logo-container { height: 100%; display: flex; align-items: center; }
        .logo-img { height: 42px; width: auto; object-fit: contain; }
        .search { width:35%; padding:12px 18px; border-radius:12px; border: 1px solid #27272a; background: #18181b; color: white; font-size:14px; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); }
        .search::placeholder { color: #71717a; }
        .search:focus { outline: none; border-color: #f43f5e; background: #18181b; box-shadow: 0 0 0 1px #f43f5e; }
        
        .container { display:flex; min-height:calc(100vh - 72px); }
        
        /* Menu Lateral - Minimalista */
        .sidebar { width: 260px; background: white; padding: 32px 20px; border-right: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 4px; }
        .sidebar h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 16px; color:#94a3b8; padding-left: 12px; font-weight: 700; }
        .sidebar button { width:100%; padding:12px 14px; background: transparent; color:#64748b; border: none; border-radius: 10px; font-size:14px; font-weight: 600; cursor:pointer; text-align: left; transition: all 0.15s ease; display: flex; align-items: center; gap: 12px; }
        .sidebar button:hover { background:#f8fafc; color:#0f172a; }
        .sidebar button.active { background: #fff1f2; color: #e11d48; font-weight: 700; }
        
        /* Botão Sair Premium */
        .sidebar .btn-logout { background: transparent; color: #f43f5e; border: none; text-align: center; font-weight: 700; margin-top: auto; justify-content: center; border: 1px solid #ffe4e6; background: #fff5f5; }
        .sidebar .btn-logout:hover { background: #ffe4e6; color: #be123c; border-color: #fecdd3; }
        
        /* Área de Conteúdo Principal */
        .content { flex:1; padding:40px; display: flex; flex-direction: column; gap: 32px; max-width: 1440px; margin: 0 auto; width: 100%; }
        .top-actions { display:flex; gap:12px; flex-wrap:wrap; }
        .top-actions button { padding:12px 24px; border:none; border-radius:10px; font-weight:600; font-size:14px; cursor:pointer; transition: all 0.2s ease; display: inline-flex; align-items: center; gap: 8px; }
        .top-actions button:hover { transform: translateY(-1px); }
        
        .btn-primary { background:#e11d48; color:white; }
        .btn-primary:hover { background:#be123c; }
        .btn-green { background:#10b981; color:white; }
        .btn-green:hover { background:#059669; }
        
        .main-layout { display: flex; gap: 36px; align-items: flex-start; }
        .aba-container { flex: 1; }
        
        /* Grid de Cards Elegantes */
        .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(240px, 1fr)); gap:24px; }
        .card { background: white; border-radius: 12px; padding: 24px; border: 1px solid #e2e8f0; transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1); display: flex; flex-direction: column; justify-content: space-between; min-height: 180px; }
        .card:hover { border-color: #94a3b8; box-shadow: 0 4px 20px rgba(15, 23, 42, 0.03); }
        .card h3 { font-size: 14px; color: #334155; font-weight: 600; line-height: 1.5; margin-bottom: 8px; }
        
        .preco { color: #0f172a; font-size: 20px; font-weight: 700; margin: 12px 0; letter-spacing: -0.5px; }
        .controls { display:flex; align-items:center; justify-content: space-between; background: #f8fafc; padding: 4px; border-radius: 30px; margin-top: auto; border: 1px solid #e2e8f0; }
        .controls button { width:32px; height:32px; border:none; border-radius:50%; font-size:16px; font-weight:bold; cursor:pointer; transition: all 0.1s ease; display: flex; align-items: center; justify-content: center; }
        .controls button:active { transform: scale(0.9); }
        .btn-plus { background:#0f172a; color:white; }
        .btn-plus:hover { background: #1e293b; }
        .btn-minus { background: white; color:#64748b; border: 1px solid #cbd5e1 !important; }
        .btn-minus:hover { background: #f1f5f9; color: #0f172a; }
        .qtd { font-size:14px; font-weight:700; color: #0f172a; padding: 0 6px; }
        
        /* Painel Lateral de Resumo - O Grande Destaque */
        .resumo { width: 380px; background: white; padding: 32px; border-radius: 16px; border: 1px solid #e2e8f0; position: sticky; top: 32px; box-shadow: 0 10px 30px -10px rgba(0,0,0,0.02); }
        .resumo h2 { font-size: 16px; font-weight: 700; margin-bottom: 24px; color:#0f172a; text-transform: uppercase; letter-spacing: 0.5px; border-bottom: 1px solid #f1f5f9; padding-bottom: 14px; }
        .resumo div { margin-bottom: 18px; font-size: 13px; color: #475569; font-weight: 600; }
        .resumo input { width:100%; padding:11px 14px; margin-top:6px; border:1px solid #cbd5e1; border-radius:8px; font-size: 14px; color: #0f172a; transition: all 0.15s ease; background: #f8fafc; font-weight: 500; }
        .resumo input:focus { outline: none; border-color: #0f172a; background: white; }
        
        /* Destaque Elegante para o Custo de Material no Resumo */
        .resumo div:has(#valorMaterial), .resumo div:has([id*="Material"]) {
            background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px 16px; border-radius: 10px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: #334155;
        }
        
        /* Destaque Ultra Premium para o VALOR TOTAL */
        .resumo div:has(#valorCliente), .resumo div:has([id*="Cliente"]) {
            background: #0f172a; color: white; padding: 20px; border-radius: 12px; margin-top: 24px; border: none; box-shadow: 0 8px 20px rgba(15,23,42,0.15);
        }
        .resumo div:has(#valorCliente) input, .resumo div:has([id*="Cliente"]) input {
            background: #1e293b; border: 1px solid #334155; color: white; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; padding: 12px; margin-top: 8px; text-align: center; border-radius: 8px;
        }
        .resumo div:has(#valorCliente) input:focus, .resumo div:has([id*="Cliente"]) input:focus {
            border-color: #38bdf8;
        }
        
        .resumo button { width:100%; padding:14px; margin-top:12px; border:none; border-radius:10px; font-weight:700; font-size: 14px; cursor:pointer; transition: all 0.15s ease; }
        
        /* Modais */
        .modal { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(9, 9, 11, 0.4); backdrop-filter: blur(4px); align-items:center; justify-content:center; z-index:999; }
        .modal-content { background:#09090b; padding:32px; border-radius:12px; width:90%; max-width:420px; color: white; max-height: 85vh; overflow-y: auto; border: 1px solid #27272a; }
        .modal-content h3 { font-size: 16px; margin-bottom: 16px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: #fff; }
        .modal-content input, .modal-content select { width:100%; padding:12px; margin:6px 0 16px 0; border:1px solid #27272a; border-radius:8px; color: white; background: #141416; font-size: 14px; }
        .modal-content input:focus, .modal-content select:focus { outline: none; border-color: #f43f5e; }
        .modal-content button { width:100%; padding:12px; border:none; border-radius:8px; margin-top:6px; font-weight:600; font-size:14px; cursor:pointer; }
        
        /* Listagem de Clientes e Histórico */
        .cliente-item { background:white; padding:24px; border-radius:12px; margin-bottom:16px; border: 1px solid #e2e8f0; color: #0f172a; }
        
        .add-servico-btn { width:100%; padding:14px; border:none; border-radius:10px; font-size:14px; font-weight:600; background: #f0fdf4; color: #15803d; border: 1px solid #bbf7d0; display:flex; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition: all 0.15s ease; }
        .add-servico-btn:hover { background: #dcfce7; }
        
        /* Filtros de Categorias */
        .categorias-materiais { display:flex; gap:6px; margin-bottom:24px; flex-wrap:wrap; }
        .categorias-materiais button { padding:8px 16px; border:none; border-radius:20px; background:#f1f5f9; color:#64748b; font-weight:600; font-size:13px; cursor:pointer; transition: all 0.15s ease; border: 1px solid transparent; }
        .categorias-materiais button:hover { background:#e2e8f0; color:#0f172a; }
        .categorias-materiais button.active { background:#0f172a; color:white; }
        
        /* Botão do WhatsApp Customizado */
        button[onclick*="enviarWhatsApp"] { background: #075e54 !important; color: white !important; font-weight: 700; border-radius: 8px; transition: 0.2s; }
        button[onclick*="enviarWhatsApp"]:hover { background: #128c7e !important; }

        /* --- DESIGN RESPONSIVO PARA O CELULAR --- */
        @media(max-width:992px){
            header { height: auto; padding: 16px; flex-direction: column; gap: 12px; align-items: stretch; }
            .search { width: 100%; padding: 11px 14px; font-size: 14px; }
            .logo-container { justify-content: center; }
            
            .container { flex-direction:column; min-height: auto; }
            
            .sidebar { width:100%; display:flex; flex-direction: row; gap:6px; overflow-x:auto; padding: 12px; height: auto; border-right: none; border-bottom: 1px solid #e2e8f0; background: #ffffff; scrollbar-width: none; }
            .sidebar::-webkit-scrollbar { display: none; }
            .sidebar h2 { display: none; }
            .sidebar button { min-width:120px; text-align: center; justify-content: center; padding: 10px; font-size: 13px; background: #f8fafc; white-space: nowrap; flex-shrink: 0; }
            
            /* Sair discreto na rolagem lateral do celular */
            .sidebar .btn-logout { 
                margin-top: 0 !important; 
                min-width: 80px !important; 
                background: #fff5f5 !important; 
                color: #f43f5e !important; 
                border: 1px solid #fee2e2 !important;
                padding: 10px !important;
                font-size: 13px !important;
            }
            
            .content { padding: 16px; gap: 20px; }
            .main-layout { flex-direction: column; gap: 20px; width: 100%; }
            
            .cards { grid-template-columns: repeat(2, 1fr); gap: 12px; }
            .card { padding: 16px; border-radius: 12px; min-height: 150px; }
            .card h3 { font-size: 13px; }
            .preco { font-size: 16px; margin: 4px 0; }
            .controls button { width: 28px; height: 28px; font-size: 14px; }
            
            .resumo { width:100%; margin-top:0; position: static; padding: 24px; border-radius: 14px; }
            
            .top-actions { gap: 8px; }
            .top-actions button { flex: 1; min-width: 130px; padding: 12px; font-size: 13px; justify-content: center; }
        }
    </style>
</head>
<body>

    <div id="loginOverlay" style="display:flex; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.95); align-items:center; justify-content:center; z-index:9999;">
        <div style="background:#1e1e1e; padding:35px; border-radius:16px; width:90%; max-width:400px; text-align:center;">
            <h1 style="color:#ffd700; margin-bottom:8px;">ALDINEICAR</h1>
            <p style="color:#888; margin-bottom:25px;">Sistema Profissional</p>

            <div style="display:flex; gap:8px; margin-bottom:20px;">
                <button id="tabLogin" onclick="toggleTab('login')" style="flex:1; padding:12px; background:#ffd700; color:#111; border:none; border-radius:10px; font-weight:bold;">Entrar</button>
                <button id="tabSignup" onclick="toggleTab('signup')" style="flex:1; padding:12px; background:transparent; color:white; border:2px solid #444; border-radius:10px; font-weight:bold;">Cadastrar</button>
            </div>

            <div id="loginForm">
                <input type="email" id="loginEmail" placeholder="Email" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <input type="password" id="loginPassword" placeholder="Senha" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <button onclick="handleLogin()" style="width:100%; padding:14px; background:#d40000; color:white; border:none; border-radius:10px; margin-top:10px; font-weight:bold;">Entrar</button>
            </div>

            <div id="signupForm" style="display:none;">
                <input type="text" id="signupName" placeholder="Nome completo" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <input type="email" id="signupEmail" placeholder="Email" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <input type="password" id="signupPassword" placeholder="Senha (mín. 6 caracteres)" style="width:100%; padding:13px; margin:8px 0; background:#2d2d2d; border:none; border-radius:10px; color:white;">
                <button onclick="handleSignup()" style="width:100%; padding:14px; background:#00a651; color:white; border:none; border-radius:10px; margin-top:10px; font-weight:bold;">Criar Conta</button>
            </div>
        </div>
    </div>

    <div id="appContainer">
        <header>
            <div class="logo-container" id="headerLogoContainer">
                <span id="headerTextoFallback" style="font-weight: bold; font-size: 20px; display: none;">ALDINEICAR</span>
            </div>
            <input type="text" class="search" placeholder="Buscar materiais..." onkeyup="buscar(this.value)">
        </header>

        <div class="container">
            <div class="sidebar">
                <div>
                    <h2>Menu</h2>
                    <button onclick="mostrarAba('maoobra')">🔧 Mão de Obra</button>
                    <button onclick="mostrarAba('materiais')">📦 Materiais</button>
                    <button onclick="mostrarAba('clientes')">👤 Clientes</button>
                    <button onclick="mostrarAba('historico')">📋 Histórico</button>
                    <button onclick="abrirModalOficina()" style="background:#f9f9f9; border: 1px dashed #bbb;">⚙️ Configurar Oficina</button>
                </div>
                <button onclick="handleLogout()" class="btn-logout">🚪 Sair</button>
            </div>

            <div class="content">
                <div class="top-actions">
                    <button class="btn-primary" onclick="abrirModal()">➕ Novo Material</button>
                    <button class="btn-green" onclick="salvarOrcamento()">💾 Salvar Orçamento</button>
                    <button class="btn-primary" onclick="gerarPDFdoResumo()">📄 Gerar PDF</button>
                </div>

                <div class="main-layout">
                    <div class="aba-container">
                        <div id="aba-materiais">
                            <div class="categorias-materiais">
                                <button onclick="filtrarCategoria('Todos')" class="btn-green">Todos</button>
                                <button onclick="filtrarCategoria('Primer')">Primer</button>
                                <button onclick="filtrarCategoria('Tintas')">Tintas</button>
                                <button onclick="filtrarCategoria('Verniz')">Verniz</button>
                                <button onclick="filtrarCategoria('Massa')">Massa</button>
                                <button onclick="filtrarCategoria('Thinner')">Thinner</button>
                                <button onclick="filtrarCategoria('Acessórios')" class="btn-primary">Acessórios</button>
                            </div>
                            <div class="cards" id="lista"></div>
                        </div>

                        <div id="aba-maoobra" style="display:none">
                            <h2>Mão de Obra</h2>
                            <div class="card" style="margin-bottom:20px; margin-top: 15px;">
                                <input type="text" id="nomeServico" placeholder="Nome da peça ou serviço" style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;">
                                <input type="number" id="valorServico" placeholder="Valor da mão de obra" style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;">
                                <button class="btn-green add-servico-btn" onclick="adicionarMaoObra()">
                                    <span>＋</span> Adicionar Serviço
                                </button>
                            </div>
                            <div id="listaMaoObra"></div>
                        </div>

                        <div id="aba-clientes" style="display:none">
                            <h2>Clientes Cadastrados</h2>
                            <div class="clientes" id="listaClientes"></div>
                        </div>

                        <div id="aba-historico" style="display:none">
                            <h2>Histórico de Orçamentos</h2>
                            <div id="historicoLista" style="margin-top: 15px;"></div>
                        </div>
                    </div>

                    <div class="resumo">
                        <h2>Resumo</h2>
                        <div>Custo Materiais: R$ <span id="totalMateriais">0.00</span></div>
                        <div>Mão de Obra Total: R$ <span id="totalMaoObra">0.00</span></div>
                        <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #ddd;">
                        
                        <label style="font-size:12px; font-weight:bold; color:#555;">CLIENTE</label>
                        <input type="text" id="clienteNome" placeholder="Nome do cliente">
                        <input type="text" id="clienteEndereco" placeholder="Endereço">
                        <input type="text" id="clienteTel" placeholder="Telefone">
                        <input type="text" id="clienteCidade" placeholder="Cidade/UF" value="Sátrio Dias/BA">
                        
                        <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #ddd;">
                        <label style="font-size:12px; font-weight:bold; color:#555;">VEÍCULO</label>
                        <input type="text" id="veiculoModelo" placeholder="Modelo (Ex: Palio)">
                        <input type="text" id="veiculoPlaca" placeholder="Placa">
                        <input type="text" id="veiculoAno" placeholder="Ano">
                        <input type="text" id="veiculoCor" placeholder="Cor">
                        <input type="text" id="nomeAvaliador" placeholder="Nome do Avaliador">
                        <input type="text" id="tipoServico" placeholder="Tipo de Serviço (Ex: Pintura Geral)">

                        <hr style="margin: 10px 0; border: 0; border-top: 1px dashed #ddd;">
                        <label style="font-size:12px; font-weight:bold; color:#555;">FINANCEIRO</label>
                        <input type="number" id="valorCliente" placeholder="Valor total cobrado" oninput="atualizarResumo()">
                        
                        <div style="margin-top: 15px; font-weight: bold; font-size: 16px;">
                            Lucro Real: <span style="color: #00a651;">R$ <span id="lucro">0.00</span></span>
                        </div>
                        <button class="btn-green" onclick="enviarWhatsApp()">📱 Enviar WhatsApp</button>
                        <button class="btn-primary" onclick="limparResumo()">🗑️ Limpar Resumo</button>
                    </div>
                </div>
            </div> 
        </div> 
    </div>

    <div class="modal" id="modal">
        <div class="modal-content">
            <h2>Novo Material</h2>
            <input type="text" id="nomeMaterial" placeholder="Nome">
            <input type="number" id="valorMaterial" placeholder="Valor">
            <select id="categoriaMaterial" aria-label="Selecione a categoria do material">
                <option value="Primer">Primer</option>
                <option value="Tintas">Tintas</option>
                <option value="Verniz">Verniz</option>
                <option value="Massa">Massa</option>
                <option value="Thinner">Thinner</option>
                <option value="Acessórios">Acessórios</option>
            </select>
            <button class="btn-green" onclick="salvarMaterial()">Salvar</button>
            <button class="btn-primary" onclick="fecharModal()">Cancelar</button>
        </div>
    </div>

    <div class="modal" id="modalOficina">
        <div class="modal-content">
            <h2>Dados da Minha Oficina</h2>
            
            <label style="font-size:11px; font-weight:bold; color:#ffd700; display:block; margin-top:10px;">LOGO DA OFICINA</label>
            <input type="file" id="oficinaLogoFile" accept="image/*" onchange="processarNovaLogo(this)" style="background: #2d2d2d; color: white; border: none; padding: 5px;">

            <input type="text" id="oficinaCnpj" placeholder="CNPJ / CPF">
            <input type="text" id="oficinaEnd" placeholder="Endereço Completo">
            <input type="text" id="oficinaCep" placeholder="CEP e Cidade/UF">
            <input type="text" id="oficinaFone" placeholder="Telefone(s)">
            <input type="text" id="oficinaEmail" placeholder="E-mail">
            <input type="text" id="oficinaPix" placeholder="Chave PIX para pagamento">
            <button class="btn-green" onclick="salvarDadosOficina()">Salvar Dados</button>
            <button class="btn-primary" onclick="fecharModalOficina()">Fechar</button>
        </div>
    </div>

    <div id="modalConfirmar" class="modal">
        <div class="modal-content" style="max-width:350px; text-align:center; background:white; color:#333;">
            <h2 style="margin-bottom:15px;">Confirmar exclusão</h2>
            <p id="textoConfirmacao" style="margin-bottom:20px; font-size:15px; color:#666;">Deseja realmente excluir?</p>
            <div style="display:flex; gap:10px;">
                <button onclick="fecharConfirmacao()" style="flex:1; padding:14px; border:none; border-radius:12px; background:#ddd; font-weight:bold; cursor:pointer;">Cancelar</button>
                <button id="btnConfirmarAcao" style="flex:1; padding:14px; border:none; border-radius:12px; background:#d40000; color:white; font-weight:bold; cursor:pointer;">Excluir</button>
            </div>
        </div>
    </div>

    <script>
    const supabaseUrl = 'https://nhqipyzikujszddoxlir.supabase.co';
    const supabaseKey = 'sb_publishable_PRTUmHIzf0pbq09qn9RwvQ_DZQowl4D';
    const supabaseClient = supabase.createClient(supabaseUrl, supabaseKey);

    let usuarioAtualId = null;
    let materiais = [];
    let historico = [];
    let clientes = []; 
    let maoObraItens = [];
    let dadosOficina = { nome: 'ALDINEICAR', cnpj: '', end: '', cep: '', fone: '', email: '', pix: '', logoBase64: '' };
    let categoriaAtual = 'Todos';
    let acaoConfirmada = null;

    const materiaisPadrao = [
        {nome:'Primer PU',valor:25,qtd:0,cat:'Primer'},
        {nome:'Verniz PU',valor:65,qtd:0,cat:'Verniz'},
        {nome:'Massa Poliéster',valor:30,qtd:0,cat:'Massa'},
        {nome:'Preto Ninja',valor:55,qtd:0,cat:'Tintas'}
    ];

    async function carregarDadosDoUsuario(userId) {
        if (!userId) return;
        usuarioAtualId = userId;
        
        const fallback = localStorage.getItem(`aldineicar_fallback_${userId}`);
        if(fallback){
            const parsed = JSON.parse(fallback);
            materiais = parsed.materiais || [...materiaisPadrao];
            historico = parsed.historico || [];
            clientes = parsed.clientes || [];
            maoObraItens = parsed.maoObraItens || [];
            dadosOficina = parsed.dadosOficina || dadosOficina;
        } else {
            materiais = [...materiaisPadrao];
        }

        try {
            const { data, error } = await supabaseClient
                .from('user_data')
                .select('*')
                .eq('user_id', userId);

            if (error) {
                await salvarNoBanco(true); 
            } else if (data && data.length > 0) {
                const registro = data[0];
                materiais = registro.materiais || [...materiaisPadrao];
                historico = registro.historico || [];
                clientes = registro.clientes || [];
                maoObraItens = registro.mao_obra || [];
                if(registro.dados_oficina) dadosOficina = registro.dados_oficina;
                
                clientes = clientes.map(c => typeof c === 'string' ? {nome: c, endereco: '', tel: '', cidade: ''} : c);
                salvarFallbackLocal();
            } else {
                await salvarNoBanco(true);
            }
        } catch (err) {
            console.error("Erro na comunicação com a nuvem:", err);
        }

        atualizarInputsOficina();
        atualizarLogoHeader();
        render();
        renderMaoObra();
        renderHistorico();
        renderClientes();
    }
    
    function salvarFallbackLocal() {
        if (!usuarioAtualId) return;
        localStorage.setItem(`aldineicar_fallback_${usuarioAtualId}`, JSON.stringify({
            materiais, historico, clientes, maoObraItens, dadosOficina
        }));
    }

    async function salvarNoBanco(silencioso = false) {
        if (!usuarioAtualId) return;
        salvarFallbackLocal();
        try {
            const { error } = await supabaseClient
                .from('user_data')
                .upsert({
                    user_id: usuarioAtualId,
                    materiais: materiais,
                    historico: historico,
                    clientes: clientes,
                    mao_obra: maoObraItens,
                    dados_oficina: dadosOficina,
                    updated_at: new Date()
                }, { onConflict: 'user_id' });
        } catch(e) {
            console.error("Falha de rede ao tentar sincronizar:", e);
        }
    }

    function toggleTab(tab) {
        document.getElementById('loginForm').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('signupForm').style.display = tab === 'signup' ? 'block' : 'none';
    }

    async function handleLogin() {
        const email = document.getElementById('loginEmail').value.trim();
        const password = document.getElementById('loginPassword').value;
        const btnEntrar = document.querySelector('#loginForm button');

        if (!email || !password) {
            alert("Por favor, preencha o e-mail e a senha.");
            return;
        }

        const textoOriginal = btnEntrar.innerText;
        btnEntrar.innerText = "Entrando...";
        btnEntrar.disabled = true;

        try {
            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                alert("Erro ao entrar: " + error.message);
                btnEntrar.innerText = textoOriginal;
                btnEntrar.disabled = false;
                return;
            }

            if (data && data.user) {
                await carregarDadosDoUsuario(data.user.id);
                document.getElementById('loginOverlay').style.display = 'none';
                mostrarAba('materiais');
            }
        } catch (err) {
            alert("Erro de conexão ou no servidor: " + err.message);
        } finally {
            btnEntrar.innerText = textoOriginal;
            btnEntrar.disabled = false;
        }
    }

    async function handleSignup() {
        const nome = document.getElementById('signupName').value.trim();
        const email = document.getElementById('signupEmail').value.trim();
        const password = document.getElementById('signupPassword').value;
        const btnCadastrar = document.querySelector('#signupForm button');

        if (!email || !password || password.length < 6) {
            alert("Preencha todos os campos corretamente (Senha mínima de 6 caracteres)");
            return;
        }

        const textoOriginal = btnCadastrar.innerText;
        btnCadastrar.innerText = "Cadastrando...";
        btnCadastrar.disabled = true;

        try {
            const { data, error } = await supabaseClient.auth.signUp({
                email, password, options: { data: { nome } }
            });

            if (error) {
                alert("Erro ao cadastrar: " + error.message);
                return;
            }

            alert("Cadastro realizado com sucesso! Agora faça login.");
            toggleTab('login');
        } catch (err) {
            alert("Erro no processo de cadastro: " + err.message);
        } finally {
            btnCadastrar.innerText = textoOriginal;
            btnCadastrar.disabled = false;
        }
    }

        let lucroReal = valorCobrado - totalMateriais;

        const tm = document.getElementById('totalMateriais');
        const tmo = document.getElementById('totalMaoObra');

        const valorCobrado = parseFloat(document.getElementById('valorCliente').value) || 0;
        
        let totalMateriais = materiais.reduce((s, item) => s + (item.valor * item.qtd), 0);
        let totalMaoObra = maoObraItens.reduce((s, mo) => s + (parseFloat(mo.valor) || 0), 0);
        
        const novoOrcamento = {
            data: new Date().toLocaleString('pt-BR'),

            veiculo: {

                ano: veiculoAno, 
                cor: veiculoCor, 
                avaliador: nomeAvaliador,
                tipo_servico: tipoServico 
            },

            mao_obra: [...maoObraItens],
            
            // Salvando com os dois nomes para garantir compatibilidade total:
            totalMateriais: totalMateriais,
            totalMateriaisCalculado: totalMateriais,
            totalMaoObraCalculado: totalMaoObra,
            
            totalCobrado: valorCobrado,
            lucro: valorCobrado - totalMateriais
        };
        
        historico.unshift(novoOrcamento);
        
        const clienteExiste = clientes.some(c => c.nome.toLowerCase() === clienteNome.toLowerCase());

    function carregarParaEditar(index) {
    const item = historico[index];
    if (!item) {
        alert("Orçamento não encontrado.");
        return;
    }

    console.log("Item selecionado para editar:", item);

    // 1. Preenche os campos de texto do Cliente e Veículo
    document.getElementById('clienteNome').value = item.cliente?.nome || item.nome || '';
    document.getElementById('clienteEndereco').value = item.cliente?.endereco || item.cliente?.end || '';
    document.getElementById('clienteTel').value = item.cliente?.tel || '';
    document.getElementById('clienteCidade').value = item.cliente?.cidade || item.cliente?.city || 'Sátrio Dias/BA';

    if (item.veiculo) {
        document.getElementById('veiculoModelo').value = item.veiculo.modelo || '';
        document.getElementById('veiculoPlaca').value = item.veiculo.placa || '';
        document.getElementById('veiculoAno').value = item.veiculo.ano || '';
        document.getElementById('veiculoCor').value = item.veiculo.cor || '';
        document.getElementById('nomeAvaliador').value = item.veiculo.avaliador || '';
        
        if (document.getElementById('tipoServico')) {
            document.getElementById('tipoServico').value = item.veiculo.tipo_servico || '';
        }
    }

    // 2. Preenche o valor total cobrado do cliente
    if (document.getElementById('valorCliente')) {
        document.getElementById('valorCliente').value = item.totalCobrado || item.total || 0;
    }

    // 3. ATUALIZA AS QUANTIDADES DE MATERIAIS NA MEMÓRIA
    // Zeramos todas as quantidades antes de carregar as antigas
    if (typeof materiais !== 'undefined' && Array.isArray(materiais)) {
        materiais.forEach(m => m.qtd = 0);

        if (item.materiais && Array.isArray(item.materiais)) {
            item.materiais.forEach(matSalvo => {
                // Procura o material correspondente por ID ou Nome
                const matGeral = materiais.find(m => 
                    (m.id && matSalvo.id && m.id == matSalvo.id) || 
                    (m.nome && matSalvo.nome && m.nome.toLowerCase() === matSalvo.nome.toLowerCase())
                );
                
                if (matGeral) {
                    matGeral.qtd = parseInt(matSalvo.qtd || matSalvo.quantidade || 0);
                }
            });
        }
    }

    if (item.mao_obra && typeof maoObraItens !== 'undefined') {
        maoObraItens = [...item.mao_obra];
    }

    // 4. FORÇAR A ATUALIZAÇÃO VISUAL NA TELA
    // Tentativa automática usando as funções mais prováveis do seu código:
    let renderizou = false;
    const funcoesRender = ['renderMateriais', 'renderCards', 'exibirMateriais', 'mostrarMateriais', 'carregarMateriais', 'atualizarInterface'];
    
    funcoesRender.forEach(nomeFuncao => {
        if (typeof window[nomeFuncao] === 'function') {
            window[nomeFuncao]();
            renderizou = true;
        }
    });

    // Se as funções automáticas falharem, fazemos uma varredura cirúrgica direto nas caixinhas de texto da tela
    if (!renderizou) {
        try {
            materiais.forEach(m => {
                // Procura na tela por IDs comuns que guardam a quantidade do material
                const elementoQtd = document.getElementById(`qtd-${m.id}`) || 
                                    document.getElementById(`qtd_${m.id}`) || 
                                    document.getElementById(`qtd-${m.nome.replace(/\s+/g, '')}`) ||
                                    document.querySelector(`[data-id="${m.id}"] .qtd`);
                
                if (elementoQtd) {
                    if (elementoQtd.tagName === 'INPUT') {
                        elementoQtd.value = m.qtd;
                    } else {
                        elementoQtd.innerText = m.qtd;
                    }
                }
            });
        } catch (e) {
            console.log("Aviso: Varredura direta falhou, criando os cards manualmente.", e);
        }
    }

    // 5. RECALCULA OS TOTAIS DO RESUMO
    const funcoesCalculo = ['atualizarTotais', 'calcularTotal', 'calcular', 'atualizarResumo', 'calcTotal'];
    funcoesCalculo.forEach(nomeFuncao => {
        if (typeof window[nomeFuncao] === 'function') {
            window[nomeFuncao]();
        }
    });

    // 6. MOVE A TELA DO USUÁRIO PARA A ABA DE ORÇAMENTO (Evita que ele tenha que rolar para cima ou mudar de aba na mão)
    if (typeof mudarAba === 'function') { 
        mudarAba('resumo'); 
    } else if (typeof mudarAba === 'function') {
        mudarAba('orcamento');
    }

    alert("Orçamento carregado para edição! Verifique os materiais e valores no resumo.");
}

    function construirDocumentoPDF(nomeCli, endCli, telCli, cidCli, modVeic, placVeic, anoVeic, corVeic, avaliador, tipoServico, valorFinal, dataOrc) {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF('p', 'mm', 'a4');
        let y = 15;

        if (dadosOficina.logoBase64) {
            try { doc.addImage(dadosOficina.logoBase64, 'PNG', 15, y, 45, 20); } catch (e) {
                doc.setFillColor(240,240,240); doc.rect(15, y, 45, 20, 'F');
            }
        } else {
            doc.setFillColor(240,240,240); doc.rect(15, y, 45, 20, 'F');
        }

        doc.setFont('Helvetica', 'bold').setFontSize(16).setTextColor(0,0,0);
        doc.text((dadosOficina.nome || 'ALDINEICAR').toUpperCase(), 65, y + 5);
        
        doc.setFont('Helvetica', 'normal').setFontSize(9).setTextColor(60,60,60);
        doc.text(`CNPJ/CPF: ${dadosOficina.cnpj || '---'}`, 65, y + 10);
        doc.text(`END: ${dadosOficina.end || '---'}`, 65, y + 14);
        doc.text(`CEP: ${dadosOficina.cep || '---'}`, 65, y + 18);
        doc.text(`FONE: ${dadosOficina.fone || '---'}`, 65, y + 22);
        doc.text(`EMAIL: ${dadosOficina.email || '---'}`, 65, y + 26);
        doc.text(`PIX: ${dadosOficina.pix || '---'}`, 65, y + 30);

        doc.setFont('Helvetica', 'bold').setFontSize(10).setTextColor(0,0,0);
        doc.text(dataOrc, 175, y + 5);
        y += 36;
        doc.setDrawColor(200, 200, 200).line(15, y, 195, y);
        y += 5;

        doc.setDrawColor(0,0,0).rect(85, y, 40, 8);
        doc.setFont('Helvetica', 'bold').setFontSize(11).text('ORÇAMENTO', 92, y + 5.5);
        y += 15;

        doc.setFontSize(9).setTextColor(100,100,100).text('PLACA', 25, y).text('MODELO', 95, y).text('AVALIADOR', 155, y);
        y += 4;
        doc.setFont('Helvetica', 'bold').setTextColor(0,0,0).setFontSize(10);
        doc.text(placVeic || '---', 25, y).text(modVeic || '---', 95, y).text(avaliador || '---', 155, y);
        
        y += 4; doc.setDrawColor(0, 0, 0).setLineWidth(0.4).line(15, y, 195, y); y += 6;

        doc.setFont('Helvetica', 'bold').setFontSize(11).text('VEÍCULO', 15, y).text('CLIENTE', 110, y);
        y += 2; doc.setLineWidth(0.2).line(15, y, 100, y).line(110, y, 195, y); y += 5;

        doc.setFont('Helvetica', 'normal').setFontSize(9.5);
        doc.text(`MODELO: ${modVeic || '---'}`, 15, y).text(`NOME: ${nomeCli || '---'}`, 110, y); y += 5.5;
        doc.text(`PLACA: ${placVeic || '---'}`, 15, y).text(`ENDEREÇO: ${endCli || '---'}`, 110, y); y += 5.5;
        doc.text(`ANO: ${anoVeic || '---'}`, 15, y).text(`TEL: ${telCli || '---'}`, 110, y); y += 5.5;
        doc.text(`COR: ${corVeic || '---'}`, 15, y).text(`CIDADE: ${cidCli || '---'}`, 110, y);
        
        // --- SEÇÃO DO TIPO DE SERVIÇO ADICIONADA AQUI ---
        y += 8;
        doc.setFont('Helvetica', 'bold').setFontSize(10).text('SERVIÇO A SER REALIZADO:', 15, y);
        y += 4.5;
        doc.setFont('Helvetica', 'normal').setFontSize(9.5).text(tipoServico.toUpperCase(), 15, y);
        // ------------------------------------------------

        y += 7; doc.setLineWidth(0.8).line(15, y, 195, y); y += 10;
        doc.setLineWidth(0.3).rect(65, y, 80, 16);
        doc.setFont('Helvetica', 'normal').setFontSize(9).text('TOTAL R$', 98, y + 5);
        doc.setFont('Helvetica', 'bold').setFontSize(15).text(`R$ ${parseFloat(valorFinal).toFixed(2)}`, 91, y + 12);
        
        y += 26; doc.setLineWidth(0.2).rect(15, y, 180, 16);
        doc.setFont('Helvetica', 'bold').setFontSize(9).text('OBSERVAÇÕES', 18, y + 5);
        doc.setFont('Helvetica', 'normal').setFontSize(9).text('ORÇAMENTO VÁLIDO POR 30 DIAS', 18, y + 11);
        
        y += 35; doc.setLineWidth(0.2).line(60, y, 150, y); y += 4;
        doc.setFont('Helvetica', 'bold').setFontSize(9).text('ASSINATURA DO CLIENTE', 85, y);

        doc.save(`orcamento_${nomeCli.replace(/\s+/g, '_')}.pdf`);
    }

                document.getElementById('loginOverlay').style.display = 'flex';
                toggleTab('login');
            }
        });
    });
</script>
