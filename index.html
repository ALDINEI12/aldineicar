<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALDINEICAR - Sistema Profissional</title>
<link rel="manifest" href="/manifest.json">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}
body{background:#f4f4f4;color:#333;}
header {background: #111;color: white;padding: 12px 20px;display: flex;align-items: center;justify-content: space-between;}
.logo {font-size: 26px;font-weight: bold;color: #ffd700;}
.search{width:45%;padding:12px;border-radius:10px;border:none;font-size:16px;}
.container{display:flex;min-height:calc(100vh - 56px);}
.sidebar {width: 200px;background: white;padding: 20px 15px;border-right: 1px solid #ddd;}
.sidebar h2{margin-bottom:15px;color:#ffd700;}
.sidebar button {width:100%;padding:12px;margin-bottom:8px;background:#fff;color:#333;border:1px solid #ddd;border-radius:8px;font-size:15px;cursor:pointer;}
.sidebar button:hover {background:#ffe6e6;color:#d40000;}
.content{flex:1;padding:20px;}
.top-actions{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
.top-actions button{padding:14px 18px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
.btn-primary{background:#d40000;color:white;}
.btn-green{background:#00a651;color:white;}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:15px;}
.card {background: white;border-radius: 10px;padding: 15px;box-shadow: 0 3px 10px rgba(0,0,0,0.1);}
.card:hover{transform:translateY(-3px);}
.card h3{font-size:18px;margin-bottom:6px;}
.preco {color: #d40000;font-size: 22px;font-weight: bold;margin: 10px 0;}
.controls{display:flex;align-items:center;gap:10px;margin-top:10px;}
.controls button{width:38px;height:38px;border:none;border-radius:50%;font-size:22px;font-weight:bold;cursor:pointer;}
.btn-plus{background:#00a651;color:white;}
.btn-minus{background:#444;color:white;}
.qtd{font-size:20px;font-weight:bold;}
.resumo {width: 320px;background: white;padding: 20px;border-left: 1px solid #ddd;position:relative;}
.resumo h2{margin-bottom:15px;color:#ffd700;}
.resumo div{margin-bottom:10px;}
.resumo input{width:100%;padding:12px;margin-top:10px;border:none;border-radius:10px;}
.resumo button{width:100%;padding:14px;margin-top:10px;border:none;border-radius:10px;font-weight:bold;cursor:pointer;}
.modal{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);align-items:center;justify-content:center;z-index:999;}
.modal-content{background:#1e1e1e;padding:25px;border-radius:15px;width:90%;max-width:400px;}
.modal-content input,.modal-content select{width:100%;padding:12px;margin:10px 0;border:none;border-radius:10px;}
.modal-content button{width:100%;padding:14px;border:none;border-radius:10px;margin-top:10px;font-weight:bold;cursor:pointer;}
.clientes{margin-top:30px;}
.cliente-item{background:white;padding:15px;border-radius:14px;margin-bottom:12px;border:1px solid #e5e5e5;box-shadow:0 2px 8px rgba(0,0,0,0.08);}
.add-servico-btn{width:100%;padding:16px;border:none;border-radius:14px;font-size:16px;font-weight:bold;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer;transition:0.2s;box-shadow:0 4px 10px rgba(0,166,81,0.25);}
.add-servico-btn span{font-size:24px;line-height:1;}
.add-servico-btn:hover{transform:translateY(-2px);opacity:0.95;}
.categorias-materiais{display:flex;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
.categorias-materiais button{padding:12px 18px;border:none;border-radius:30px;background:white;color:#444;font-weight:bold;font-size:14px;cursor:pointer;transition:0.2s;box-shadow:0 2px 8px rgba(0,0,0,0.08);border:1px solid #e5e5e5;}
.categorias-materiais button:hover{transform:translateY(-2px);background:#d40000;color:white;box-shadow:0 4px 12px rgba(212,0,0,0.25);}
@media(max-width:900px){.container{flex-direction:column;}.sidebar{width:100%;display:flex;gap:10px;overflow:auto;}.sidebar button{min-width:160px;}.search{width:55%;}.resumo{width:100%;margin-top:20px;}}
</style>
</head>
<body>

<!-- Login Overlay -->
<div id="loginOverlay" style="display:flex;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.96);align-items:center;justify-content:center;z-index:9999;">
  <div style="background:#1e1e1e;padding:35px 30px;border-radius:16px;width:90%;max-width:400px;text-align:center;box-shadow:0 8px 32px rgba(0,0,0,0.6);">
    <div style="font-size:28px;font-weight:bold;color:#ffd700;margin-bottom:4px;">ALDINEICAR</div>
    <div style="color:#888;margin-bottom:24px;font-size:13px;">Sistema Profissional</div>

    <div style="display:flex;gap:8px;margin-bottom:22px;">
      <button id="tabBtnLogin" onclick="toggleAuthTab('login')" style="flex:1;padding:12px;border:2px solid #ffd700;border-radius:10px;background:#ffd700;color:#111;font-weight:bold;cursor:pointer;">Entrar</button>
      <button id="tabBtnSignup" onclick="toggleAuthTab('signup')" style="flex:1;padding:12px;border:2px solid #444;border-radius:10px;background:transparent;color:#fff;font-weight:bold;cursor:pointer;">Cadastrar</button>
    </div>

    <div id="loginTab">
      <input type="email" id="loginEmail" placeholder="Email" style="width:100%;padding:13px;margin-bottom:10px;border:none;border-radius:10px;background:#2d2d2d;color:white;">
      <input type="password" id="loginPassword" placeholder="Senha" style="width:100%;padding:13px;margin-bottom:4px;border:none;border-radius:10px;background:#2d2d2d;color:white;">
      <button onclick="handleLogin()" style="width:100%;padding:14px;background:#d40000;color:white;border:none;border-radius:10px;font-weight:bold;">Entrar</button>
    </div>

    <div id="signupTab" style="display:none;">
      <input type="text" id="signupName" placeholder="Nome completo" style="width:100%;padding:13px;margin-bottom:10px;border:none;border-radius:10px;background:#2d2d2d;color:white;">
      <input type="email" id="signupEmail" placeholder="Email" style="width:100%;padding:13px;margin-bottom:10px;border:none;border-radius:10px;background:#2d2d2d;color:white;">
      <input type="password" id="signupPassword" placeholder="Senha" style="width:100%;padding:13px;margin-bottom:4px;border:none;border-radius:10px;background:#2d2d2d;color:white;">
      <button onclick="handleSignup()" style="width:100%;padding:14px;background:#00a651;color:white;border:none;border-radius:10px;font-weight:bold;">Criar Conta</button>
    </div>
  </div>
</div>

<!-- Main Application -->
<div id="appContainer" style="display:none;flex-direction:column;min-height:100vh;">
<header>
  <div class="logo">ALDINEICAR</div>
  <input type="text" class="search" placeholder="Buscar materiais..." onkeyup="buscar(this.value)">
</header>

<div class="container">
  <div class="sidebar">
    <h2>Menu</h2>
    <button onclick="mostrarAba('maoobra')">🔧 Mão de Obra</button>
    <button onclick="mostrarAba('materiais')">📦 Materiais</button>
    <button onclick="mostrarAba('clientes')">👤 Clientes</button>
    <button onclick="mostrarAba('historico')">📋 Histórico</button>
    <button onclick="mostrarAba('cores')">🎨 Cores</button>
  </div>

  <div class="content">
    <div class="top-actions">
      <button class="btn-primary" onclick="abrirModal()">➕ Novo Material</button>
      <button class="btn-green" onclick="salvarOrcamento()">💾 Salvar Orçamento</button>
      <button class="btn-primary" onclick="gerarPDF()">📄 Gerar PDF</button>
    </div>

    <div id="aba-materiais" style="display:none;">
      <div class="categorias-materiais">
        <button onclick="filtrarCategoria('Todos')" class="btn-green">Todos</button>
        <button onclick="filtrarCategoria('Primer')">Primer</button>
        <button onclick="filtrarCategoria('Tintas')">Tintas</button>
        <button onclick="filtrarCategoria('Verniz')">Verniz</button>
        <button onclick="filtrarCategoria('Massa')">Massa</button>
        <button onclick="filtrarCategoria('Thinner')">Thinner</button>
        <button onclick="filtrarCategoria('Acessórios')" class="btn-primary">Acessórios</button>
      </div>
      <div class="cards" id="lista"></div>
    </div>

    <div id="aba-maoobra" style="display:none">
      <h2>Mão de Obra</h2>
      <div class="card" style="margin-bottom:20px;">
        <input type="text" id="nomeServico" placeholder="Nome da peça ou serviço" style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;">
        <input type="number" id="valorServico" placeholder="Valor da mão de obra" style="width:100%;padding:12px;margin-bottom:10px;border:1px solid #ccc;border-radius:10px;">
        <button class="btn-green add-servico-btn" onclick="adicionarMaoObra()">＋ Adicionar Serviço</button>
      </div>
      <div id="listaMaoObra"></div>
    </div>

    <div id="aba-clientes" style="display:none"><h2>Clientes</h2><div class="clientes" id="listaClientes"></div></div>
    <div id="aba-historico" style="display:none"><h2>Histórico</h2><div id="historico"></div></div>
    <div id="aba-cores" style="display:none"><h2>Cores cadastradas</h2><div id="coresLista"></div></div>
  </div>

  <div class="resumo">
    <h2>Resumo</h2>
    <div>Materiais: R$ <span id="totalMateriais">0.00</span></div>
    <div>Mão de obra: R$ <span id="totalMaoObra">0.00</span></div>
    <div>Saldo Atual: R$ <span id="total">0.00</span></div>
    <input type="text" id="clienteNome" placeholder="Nome do cliente">
    <input type="number" id="valorCliente" placeholder="Valor cobrado do cliente">
    <div>Lucro: R$ <span id="lucro">0.00</span></div>
    <button class="btn-green" onclick="enviarWhatsApp()">WhatsApp</button>
    <button class="btn-primary" onclick="limparResumo()">🗑️ Limpar Resumo</button>
  </div>
</div>
</div>

<!-- Modais -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h2 style="color:white;">Novo Material</h2>
    <input type="text" id="nomeMaterial" placeholder="Nome">
    <input type="number" id="valorMaterial" placeholder="Valor">
    <select id="categoriaMaterial">
      <option>Primer</option><option>Tinta</option><option>Verniz</option><option>Massa</option><option>Thinner</option><option>Acessórios</option>
    </select>
    <button class="btn-green" onclick="salvarMaterial()">Salvar</button>
    <button class="btn-primary" onclick="fecharModal()">Cancelar</button>
  </div>
</div>

<script>
// ====================== CONFIGURAÇÃO SUPABASE ======================
const supabaseUrl = 'https://nhqipyzikujszddoxlir.supabase.co';
const supabaseKey = 'sb_publishable_PRTUmHIzf0pbq09qn9RwvQ_DZQowl4D';
const supabase = Supabase.createClient(supabaseUrl, supabaseKey);

// ====================== FUNÇÕES ======================
function mostrarAba(aba) {
  document.querySelectorAll('[id^="aba-"]').forEach(div => div.style.display = 'none');
  const el = document.getElementById(`aba-${aba}`);
  if (el) el.style.display = 'block';
}

function buscar(termo) {
  termo = termo.toLowerCase();
  document.querySelectorAll('.card').forEach(card => {
    card.style.display = card.textContent.toLowerCase().includes(termo) ? '' : 'none';
  });
}

function gerarPDF() {
  const { jsPDF } = window.jspdf || {};
  if (!jsPDF) return alert("PDF não carregado");
  const doc = new jsPDF();
  doc.text("Orçamento Aldineicar", 20, 20);
  doc.save("orcamento.pdf");
}

function enviarWhatsApp() {
  const cliente = document.getElementById('clienteNome').value || "Cliente";
  const total = document.getElementById('total').textContent || "0.00";
  const mensagem = `Olá ${cliente}, seu orçamento ficou em R$ ${total}.`;
  window.open(`https://wa.me/55SEUNUMERO?text=${encodeURIComponent(mensagem)}`);
}

function limparResumo() {
  alert("Resumo limpo!");
}

function abrirModal() { document.getElementById('modal').style.display = 'flex'; }
function fecharModal() { document.getElementById('modal').style.display = 'none'; }
function salvarMaterial() { alert("Material salvo!"); fecharModal(); }
function salvarOrcamento() { alert("Orçamento salvo!"); }
function filtrarCategoria(cat) { alert("Filtrando por: " + cat); }
function adicionarMaoObra() { alert("Serviço adicionado!"); }

// Login functions
function showApp() {
  document.getElementById('loginOverlay').style.display = 'none';
  document.getElementById('appContainer').style.display = 'flex';
  mostrarAba('materiais');
}

window.handleLogin = function() { showApp(); };
window.handleSignup = function() { alert("Conta criada!"); showApp(); };

window.toggleAuthTab = function(tab) {
  document.getElementById('loginTab').style.display = 'none';
  document.getElementById('signupTab').style.display = 'none';
  document.getElementById('recoveryTab').style.display = 'none';
  document.getElementById('resetTab').style.display = 'none';
  if (tab === 'signup') document.getElementById('signupTab').style.display = 'block';
  else document.getElementById('loginTab').style.display = 'block';
};

// Inicialização
document.addEventListener('DOMContentLoaded', () => {
  console.log("✅ Aldineicar carregado com sucesso!");
});
</script>

</body>
</html>
